# OneMeld on one 48 GB CUDA GPU, every model hosted with SGLang.
# Install: uv pip install -e ".[sglang]"
#
# Backends sharing a GPU start in the order listed. Each SGLang engine sizes
# itself from the memory free when it starts, so the small engines go first
# and SenseNova, which offloads its encoders and VAE to CPU on its own, last.
#
# Measured on an RTX 4090 (47.4 GiB usable) after running every validation
# case three times: the vision model 7.2 GiB with FP8 weights, ASR 2.5 GiB,
# SenseNova 34.4 GiB, and two small worker contexts about 1.1 GiB together,
# which leaves about 2.7 GiB free. The vision model's mem_fraction_static
# covers its FP8 weights plus a 4096-token KV cache.
model_name: onemeld

backends:
  understanding:
    framework: sglang
    task: chat
    model: Qwen/Qwen3-VL-4B-Instruct
    gpu: 0
    args:
      quantization: fp8
      mem_fraction_static: 0.135
      max_total_tokens: 4096
      context_length: 8192
      max_running_requests: 4
      chunked_prefill_size: 256
      disable_overlap_schedule: true
      attention_backend: triton
      disable_cuda_graph: true
  asr:
    framework: sglang
    task: transcription
    model: Qwen/Qwen3-ASR-0.6B
    gpu: 0
    args:
      mem_fraction_static: 0.05
      max_total_tokens: 1024
      max_running_requests: 1
      attention_backend: triton
      disable_cuda_graph: true
      # Transcribe 30 s of audio at startup so the encoder's working memory
      # is reserved before SenseNova takes the rest of the GPU.
      warmup_audio_seconds: 30
  generation:
    framework: sglang
    task: image
    model: sensenova/SenseNova-U1.5-8B-MoT
    gpu: 0

composition:
  # The vision model also plans, which leaves room for SenseNova's DiT.
  planner_stage: understanding
  capabilities:
    respond:
      stages: [understanding]
      protocol: native_chat
      description: Answer text questions, or inspect and compare referenced images, including scores and a visible reason for a winner when requested.
      input_kinds: [text, image]
      parameters:
        temperature: 0.0
    generate_image:
      stages: [generation]
      protocol: image_base64
      description: Generate exactly one image from a visual prompt. Use separate calls for separate requested images.
      input_kinds: [text]
      parameters:
        width: 512
        height: 512
        num_inference_steps: 20
        guidance_scale: 4.0
    transcribe:
      stages: [asr]
      protocol: asr
      description: Transcribe one referenced speech recording of at most 30 seconds into text.
      input_kinds: [audio]
  max_steps: 6
  max_plan_attempts: 2
  max_images: 2
  audio_instruction_capability: transcribe
  max_concurrent_steps: 1
  planner_media_kinds: []
  planning_temperature: 0.0
  planning_max_new_tokens: 1536
  planning_chat_template_kwargs:
    enable_thinking: false
  trace: true

limits:
  max_active: 4
  timeout_s: 1800.0
