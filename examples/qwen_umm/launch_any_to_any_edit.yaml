config_cls: QwenAnyToAnyEditPipelineConfig
model_path: Qwen/Qwen-Image-2512
text_model_path: Qwen/Qwen2.5-VL-3B-Instruct
asr_model_path: Qwen/Qwen3-ASR-1.7B
tts_model_path: Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
edit_model_path: Qwen/Qwen-Image-Edit-2509
stages:
  understanding:
    gpu: 0
    gpu_memory_fraction: 0.2
    engine:
      mem_fraction_static: 0.18
      context_length: 16384
      max_running_requests: 1
      attention_backend: triton
      disable_cuda_graph: true
  generation:
    gpu: 0
    gpu_memory_fraction: 0.3
    factory:
      server_args_overrides:
        dit_layerwise_offload: true
        text_encoder_cpu_offload: true
        vae_cpu_offload: true
  edit:
    gpu: 0
    gpu_memory_fraction: 0.3
    factory:
      server_args_overrides:
        dit_layerwise_offload: true
        text_encoder_cpu_offload: true
        vae_cpu_offload: true
  asr:
    gpu: 0
    gpu_memory_fraction: 0.08
    factory:
      mem_fraction_static: 0.06
  tts_engine:
    gpu: 0
    gpu_memory_fraction: 0.08
    engine:
      mem_fraction_static: 0.06
  vocoder:
    gpu: 0
    gpu_memory_fraction: 0.04
