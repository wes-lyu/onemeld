[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "onemeld"
dynamic = ["version"]
description = "One API that composes several models, each hosted by its own serving framework"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.110.0",
    "msgpack>=1.0.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "pyzmq>=25.0.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
# Each framework extra goes in the environment its backends run in, and can be
# a separate environment named by a backend's python setting.
sglang = [
    "numpy>=1.24.0",
    "sglang==0.5.23; sys_platform == 'linux'",
    "torch==2.14.1",
]
# note (Wes): tested with SGLang-Omni main at 7190291 and sglang 0.5.23; pin a
# commit once an SGLang-Omni pipeline is verified through OneMeld on a GPU host.
sglang-omni = [
    "numpy>=1.24.0",
    "sglang==0.5.23; sys_platform == 'linux'",
    "sglang-omni @ git+https://github.com/sgl-project/sglang-omni@main ; sys_platform == 'linux'",
    "torch==2.14.1",
]
test = [
    "httpx",
    "numpy>=1.24.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "torch==2.14.1",
]

[project.scripts]
onemeld = "onemeld.cli:main"

[project.urls]
Upstream = "https://github.com/sgl-project/sglang-omni"

[tool.uv]
# Resolve the native CUDA profile on Linux.
environments = [
    "sys_platform == 'linux'",
]
override-dependencies = [
    "protobuf>=6.31.1,<7.0.0; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "protobuf>=7.35.1,<8.0.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "accelerator: requires accelerator hardware",
]

[tool.ruff.lint]
exclude = ["tests/**"]
select = [
    "ANN401",
    "B006",     # Mutable argument defaults
    "B009",     # Constant-name getattr without a default
    "B010",     # Constant-name setattr
    "E722",     # No bare except
    "F403",     # No wildcard imports
    "N801",     # Class names
    "N815",     # Class-scope variable names
    "N816",     # Module-scope variable names
    "PGH004",   # No blanket noqa
    "RUF008",   # Mutable dataclass defaults
    "SIM115",   # Context managers for files (not sockets/CUDA streams)
]

[tool.ruff.lint.per-file-ignores]
"!onemeld/**" = ["ANN401"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "onemeld",
    "onemeld.*",
]
namespaces = true

[tool.setuptools.dynamic]
version = {attr = "onemeld.__version__"}
