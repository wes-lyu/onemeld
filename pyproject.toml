[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "onemeld"
dynamic = ["version"]
description = "Unified model serving with independent specialist models"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate>=0.27.0",
    "av>=16.1.0",
    "cache-dit==1.3.0",
    "fastapi>=0.110.0",
    "flash-attn-4>=4.0.0b18; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "flashinfer_python[cu13]==0.7.1; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "httpx",
    "huggingface-hub[hf_xet]>=0.36.0",
    "kernels>=0.14.1,<0.15; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "librosa>=0.11.0",
    "msgpack>=1.0.0",
    "msgspec",
    "numpy>=1.24.0",
    "numba==0.65.1",
    "pillow>=10.0.0",
    "pybase64>=1.4.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "pyzmq>=25.0.0",
    "safetensors>=0.4.3",
    "scipy>=1.10.0",
    "sglang==0.5.22; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "soundfile>=0.12.0",
    "torch==2.14.1",
    "torch_memory_saver==0.0.10; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torchaudio==2.11.0",
    "torchvision==0.29.1",
    "transformers==5.19.0",
    "typing-extensions>=4.13",
    "uvicorn>=0.30.0",
    "xxhash>=3.0.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0"]

[project.scripts]
onemeld = "sglang_omni.cli:main"

[project.urls]
Upstream = "https://github.com/sgl-project/sglang-omni"

[tool.uv]
# Resolve the native CUDA profile on Linux.
environments = [
    "sys_platform == 'linux'",
]
override-dependencies = [
    "protobuf>=6.31.1,<7.0.0; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "protobuf>=7.35.1,<8.0.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "accelerator: requires accelerator hardware",
]

[tool.ruff.lint]
exclude = ["tests/**"]
select = [
    "ANN401",
    "B006",     # Mutable argument defaults
    "B009",     # Constant-name getattr without a default
    "B010",     # Constant-name setattr
    "E722",     # No bare except
    "F403",     # No wildcard imports
    "N801",     # Class names
    "N815",     # Class-scope variable names
    "N816",     # Module-scope variable names
    "PGH004",   # No blanket noqa
    "RUF008",   # Mutable dataclass defaults
    "SIM115",   # Context managers for files (not sockets/CUDA streams)
]

[tool.ruff.lint.per-file-ignores]
"!sglang_omni/**" = ["ANN401"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "sglang_omni",
    "sglang_omni.*",
]
namespaces = true

[tool.setuptools.dynamic]
version = {attr = "sglang_omni.__version__"}
